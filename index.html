<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#12211B" />
<title>Caja de Axis</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap');
  :root {
    --ink: #12211B; --muted: #5A6B63; --faint: #8A978F; --line: #E3E9E6; --field: #D3DCD8;
    --soft: #F1F5F3; --bg: #F7F9F8; --accent: #2F6F6D; --accent-soft: #E3F0EF; --bad: #B23A3A; --good: #2F7D4F; --warn: #B45309;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: 'Barlow', system-ui, sans-serif; font-size: 15px; }
  * { box-sizing: border-box; }
  button { font-family: inherit; }
  .axis-display { font-family: 'Barlow Condensed', 'Barlow', sans-serif; letter-spacing: .02em; }

  /* botones */
  .axis-btn { border: none; border-radius: 10px; padding: 9px 14px; font: 600 13px 'Barlow', sans-serif; cursor: pointer; }
  .axis-btn.primary { background: var(--ink); color: #fff; }
  .axis-btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--field); }
  .axis-btn:disabled, .cj-btn:disabled, .cj-pill:disabled { opacity: .45; cursor: not-allowed; }
  .cj-btn { border: none; border-radius: 12px; padding: 12px 22px; font-size: 15px; font-weight: 700; cursor: pointer; background: var(--ink); color: #fff; display: inline-flex; align-items: center; gap: 8px; }
  .cj-btn.accent { background: var(--accent); }
  .cj-btn.sec { background: #fff; color: var(--ink); border: 1px solid var(--field); }
  .cj-btn.sm { padding: 8px 14px; font-size: 13px; border-radius: 10px; }
  .cj-link { background: none; border: none; color: var(--accent); font-weight: 600; font-size: 13px; cursor: pointer; padding: 0; }
  .cj-link.bad { color: var(--bad); }
  .cj-ico { background: none; border: 1px solid transparent; border-radius: 8px; width: 34px; height: 34px; cursor: pointer; color: var(--muted); font-size: 15px; }
  .cj-ico:hover { background: var(--soft); color: var(--ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* campos */
  input, select, textarea { font-family: 'Barlow', sans-serif; }
  .axis-input, .cj-input { border: 1px solid var(--field); border-radius: 12px; padding: 0 14px; font-size: 15px; background: #fff; width: 100%; height: 46px; color: var(--ink); }
  .axis-input { height: 38px; font-size: 13px; border-radius: 10px; padding: 0 10px; }
  .cj-input.big { height: 56px; font-size: 24px; font-weight: 700; padding-right: 40px; }
  .axis-input:focus, .cj-input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
  .cj-input:disabled { background: var(--soft); color: var(--muted); }
  .cj-euro { position: relative; }
  .cj-euro > span { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--faint); font-weight: 600; pointer-events: none; }
  .cj-field { display: grid; gap: 7px; align-content: start; min-width: 0; }
  .cj-label { font-size: 14px; font-weight: 600; color: var(--ink); }
  .cj-eyebrow { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
  .cj-hint { font-size: 12.5px; color: var(--muted); }
  .cj-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

  /* tarjetas y secciones */
  .cj-card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px; box-shadow: 0 1px 2px rgba(18,33,27,.04); }
  .cj-sec { display: grid; gap: 16px; padding: 22px 0; border-top: 1px solid var(--line); }
  .cj-sec:first-of-type { border-top: none; padding-top: 4px; }
  .cj-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; }
  .cj-grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px 20px; }
  .cj-stack { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }

  /* pestañas subrayadas (como AimHarder) */
  .cj-tabs { display: flex; gap: 30px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  .cj-tab { background: none; border: none; padding: 14px 2px; font-size: 16px; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; font-weight: 500; }
  .cj-tab:hover { color: var(--ink); }
  .cj-tab.on { color: var(--accent); font-weight: 700; border-bottom-color: var(--accent); }
  .cj-tabs.sub { justify-content: center; }

  /* píldoras y segmentados */
  .cj-pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .cj-pill { border: 1px solid var(--field); background: #fff; border-radius: 999px; padding: 9px 18px; font-size: 14px; cursor: pointer; color: var(--ink); transition: border-color .12s, background .12s; }
  .cj-pill:hover:not(:disabled) { border-color: var(--accent); }
  .cj-pill.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .cj-pill.sm { padding: 6px 12px; font-size: 13px; }
  .cj-seg { display: inline-flex; background: var(--soft); border-radius: 12px; padding: 4px; gap: 2px; flex-wrap: wrap; }
  .cj-seg button { border: none; background: transparent; padding: 9px 16px; border-radius: 9px; font-size: 14px; cursor: pointer; color: var(--muted); font-weight: 600; }
  .cj-seg button.on { background: var(--accent); color: #fff; }
  .cj-chip { display: inline-block; padding: 3px 11px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 600; white-space: nowrap; }
  .cj-chip.mute { background: var(--soft); color: var(--muted); font-weight: 500; }
  .cj-chip.warn { background: #FBEFE0; color: var(--warn); }
  .cj-chips { display: flex; flex-wrap: wrap; gap: 6px; }

  /* servicios incluidos */
  .cj-lines { display: grid; gap: 10px; }
  .cj-line { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 12px 14px; background: var(--soft); border-radius: 14px; }
  .cj-line-name { font-weight: 600; min-width: 170px; }
  .cj-stepper { display: inline-flex; align-items: center; background: #fff; border: 1px solid var(--field); border-radius: 12px; overflow: hidden; }
  .cj-stepper button { width: 38px; height: 38px; border: none; background: #fff; font-size: 18px; cursor: pointer; color: var(--accent); }
  .cj-stepper button:hover:not(:disabled) { background: var(--accent-soft); }
  .cj-stepper input { width: 52px; height: 38px; border: none; text-align: center; font-size: 15px; font-weight: 700; background: #fff; }
  .cj-stepper input:focus { outline: none; background: var(--accent-soft); }

  /* importe y desglose */
  .cj-desglose { display: grid; grid-template-columns: repeat(3, auto); gap: 6px 28px; justify-content: start; padding: 14px 18px; background: var(--soft); border-radius: 14px; }
  .cj-desglose .k { font-size: 12px; color: var(--muted); }
  .cj-desglose .v { font-size: 16px; font-weight: 600; }
  .cj-desglose .t { font-size: 22px; font-weight: 700; color: var(--accent); }

  /* listas */
  .cj-fila { display: grid; grid-template-columns: 56px 1fr auto auto; gap: 8px 16px; align-items: center; padding: 14px 6px; border-bottom: 1px solid var(--line); }
  .cj-fila:last-child { border-bottom: none; }
  .cj-fila:hover { background: #FAFCFB; }
  .cj-fecha { text-align: center; line-height: 1.15; color: var(--muted); font-size: 12px; }
  .cj-fecha b { display: block; font-size: 20px; color: var(--ink); }
  .cj-titulo { font-weight: 700; font-size: 15px; }
  .cj-sub { color: var(--muted); font-size: 13px; margin: 1px 0 6px; }
  .cj-importe { text-align: right; line-height: 1.25; }
  .cj-importe b { font-size: 17px; }
  .cj-kpi { display: flex; gap: 14px 40px; flex-wrap: wrap; }
  .cj-kpi .n { font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 700; line-height: 1.05; }

  /* selector con buscador */
  .cj-pop { position: absolute; left: 0; right: 0; top: calc(100% + 6px); max-height: 300px; overflow-y: auto; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 14px 36px rgba(18,33,27,.16); z-index: 30; padding: 6px; }
  .cj-opt { padding: 10px 12px; border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 14px; font-size: 14px; }
  .cj-opt.on { background: var(--soft); }
  .cj-opt .det { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .cj-opt.nuevo { color: var(--accent); font-weight: 700; }

  /* tarifas */
  .cj-tarifas { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .cj-tarifa { text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; cursor: pointer; display: grid; gap: 8px; align-content: start; }
  .cj-tarifa:hover { border-color: var(--accent); box-shadow: 0 4px 18px rgba(47,111,109,.12); }
  .cj-tarifa h3 { margin: 0; font-size: 15px; line-height: 1.3; }
  .cj-tarifa .precio { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 700; }

  .cj-aviso { padding: 12px 16px; border-radius: 12px; font-size: 14px; }
  .cj-aviso.ok { background: #E8F4EC; color: #1F5B3A; }
  .cj-aviso.mal { background: #FBE9E9; color: var(--bad); }

  @media (max-width: 720px) {
    body { font-size: 16px; }
    .cj-grid2 { grid-template-columns: 1fr; }
    .cj-card { padding: 18px 16px; }
    .cj-fila { grid-template-columns: 48px 1fr; }
    .cj-fila .cj-importe { grid-column: 2; text-align: left; }
    .cj-fila .cj-acciones { grid-column: 2; }
    .axis-input, .cj-input { font-size: 16px; }
    .cj-tabs { gap: 22px; }
    .cj-line-name { min-width: 100%; }
  }
</style>
</head>
<body>
<div id="root">
  <p style="font-family: sans-serif; padding: 24px; color: #5A6B63;">Cargando la Caja…</p>
</div>

<!-- React 18 -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<!-- Supabase: base de datos, login y tiempo real -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="caja.js?v=11"></script>
</body>
</html>
